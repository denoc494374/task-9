<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="level6.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card" style="width: 480px;">
            <div class="card-body text-center">
                <h5 class="card-title"><strong>Level 6 </strong></h5>
                <p class="card-text">Choose the correct door. Only one door is correct.</p>

                <div class="doors d-flex justify-content-between my-4">
                    <button class="btn door-btn" data-door="1">
                        <img src="assets/door.avif" alt="Door 1" class="door-img">
                        <div class="door-label">Door 1</div>
                    </button>
                    <button class="btn door-btn" data-door="2">
                        <img src="assets/door.avif" alt="Door 2" class="door-img">
                        <div class="door-label">Door 2</div>
                    </button>
                    <button class="btn door-btn" data-door="3">
                        <img src="assets/door.avif" alt="Door 3" class="door-img">
                        <div class="door-label">Door 3</div>
                    </button>
                </div>

                <div id="resultMessage" style="min-height:3rem;"></div>

                <div class="d-flex gap-2 mt-4 justify-content-center">
                    <a href="level5.html" class="btn btn-secondary">Back</a>
                    <a id="restartBtn" href="level1.html" class="btn btn-warning">Restart</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="level6.js"></script>
</body>
</html>
