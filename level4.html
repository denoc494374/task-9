<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="level4.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card" style="width: 400px;">
            <div class="card-body">
                <h5 class="card-title"><strong>Level 4</strong></h5>
                
                <p class="card-text">Welcome to Level 4 Quest. 
                    <br><br>
                    Enter your name to proceed.</p>
                
                <div class="mb-3">
                    <label for="nameInput" class="form-label">Name:</label>
                    <input type="text" class="form-control" id="nameInput" placeholder="Enter your name">
                    <div id="errorMessage" class="alert alert-danger mt-2" style="display: none;">Name cannot be empty!</div>
                    <div id="successMessage" class="alert alert-success mt-2" style="display: none;"></div>
                </div>

                <button id="submitBtn" class="btn btn-info mb-3 w-100">Submit Name</button>
                
                <div class="d-flex gap-2">
                    <a href="level3.html" class="btn btn-secondary">Back</a>
                    <a id="nextBtn" href="level5.html" class="btn btn-primary disabled" style="flex: 1;">Next</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="level4.js"></script>
</body>
</html>
