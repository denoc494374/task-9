<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="level3.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card" style="width: 400px;">
            <div class="card-body">
                <h5 class="card-title"><strong>Level 3</strong></h5>
                
                <div class="badge-container">
                    <span id="levelBadge" class="badge bg-info">Level: 0</span>
                    <div id="levelText">Reach level 100 to proceed (0/100)</div>
                </div>

                <p class="card-text">Welcome to Level 3 Quest. 
                    <br><br>
                    Use the Level Up button to advance, then proceed to Level 4.</p>
                
                <div class="d-flex gap-2 flex-column">
                    <button id="levelUpBtn" class="btn btn-success">Level Up</button>
                    <div class="d-flex gap-2">
                        <a href="level2.html" class="btn btn-secondary">Back</a>
                        <a id="nextBtn" href="level4.html" class="btn btn-primary disabled">Next</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="level3.js"></script>
</body>
</html>
