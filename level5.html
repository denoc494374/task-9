<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="level5.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card" style="width: 400px;">
            <div class="card-body">
                <h5 class="card-title"><strong>Level 5</strong></h5>
                
                <p class="card-text">Welcome to Level 5 Quest. 
                    <br><br>
                    Collect 20 coins to proceed!</p>
                
                <div class="requirement-message" id="requirementMessage">Coins needed: 20</div>
                
                <div class="coin-counter-container">
                    <div class="coin-display">
                        <span class="coin-icon">💰</span>
                        <div id="coinCount" class="coin-number">0</div>
                    </div>
                    
                    <div class="counter-buttons mt-4">
                        <button id="decreaseBtn" class="btn btn-danger btn-lg">−</button>
                        <button id="increaseBtn" class="btn btn-success btn-lg">+</button>
                    </div>
                </div>
                
                <div class="d-flex gap-2 mt-4">
                    <a href="level4.html" class="btn btn-secondary">Back</a>
                    <a id="nextBtn" href="level6.html" class="btn btn-primary disabled">Next</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="level5.js"></script>
</body>
</html>
